name: Retry lead notifications

# Safety net between Vercel's daily cron runs (Hobby plan allows daily only):
# every 3 hours, ask the site to email any lead whose owner notification failed.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Call notify-pending
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set, so failed lead notifications are not being retried. Add it under Settings > Secrets and variables > Actions (same value as in Vercel)."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://oakheart-lab.vercel.app/api/cron/notify-pending
